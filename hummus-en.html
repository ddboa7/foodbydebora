lisher":{"@id":"https://foodbydebora.com/#business"},"recipeCategory":"Sauce","recipeCuisine":"Vegan","inLanguage":"en","keywords":"Hummus, vegan, plant-based, whole food","suitableForDiet":["https://schema.org/VeganDiet"],"prepTime":"PT15M","cookTime":"PT0M","totalTime":"PT15M","recipeYield":"4 people","recipeIngredient":["120 g dried or 360 g cooked chickpeas","3 tbsp tahini (sesame paste)","3 tsp lemon juice","1/2 garlic clove, germ removed","3/4 tsp rock salt, more to taste","freshly ground pepper","1/2 tsp ground cumin (for better digestion)","68 g water","cooked chickpeas, olive oil, paprika powder, parsley"],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"Soak the dried chickpeas in cold water for 24 h, changing the water at least twice. Rinse well. Cook the chickpeas for 25 min in a pressure cooker, or 2-3 h in a pot on low heat. Skim off the foam occasionally."},{"@type":"HowToStep","position":2,"text":"For an even creamier hummus, peel the chickpeas by gently rubbing the warm chickpeas between both hands. It helps to do this in a pot filled with water - the skins float to the top and can be poured off."},{"@type":"HowToStep","position":3,"text":"Blend the still-warm chickpeas with the remaining ingredients. Slightly warm hummus tastes better than cold."},{"@type":"HowToStep","position":4,"text":"Kept in an airtight container in the fridge, the hummus lasts several days."}]}]}</script>
